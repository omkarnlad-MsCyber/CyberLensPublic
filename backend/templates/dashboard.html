<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLens Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .risk-high { color: #e74c3c; }
        .risk-medium { color: #f39c12; }
        .risk-low { color: #27ae60; }
        
        .section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .history-list {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .history-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .host-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .timestamp {
            color: #999;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .issues {
            list-style: none;
            padding-left: 0;
        }
        
        .issues li {
            padding: 3px 0;
            font-size: 14px;
            color: #666;
        }
        
        .issues li:before {
            content: "• ";
            color: #667eea;
            font-weight: bold;
        }
        
        .rating-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .badge-high {
            background: #e74c3c;
            color: white;
        }
        
        .badge-medium {
            background: #f39c12;
            color: white;
        }
        
        .badge-low {
            background: #27ae60;
            color: white;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔒 CyberLens Dashboard</h1>
            <p class="subtitle">Real-time network traffic monitoring and security analysis</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Scans</div>
                <div class="stat-value" id="totalScans">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">High Risk</div>
                <div class="stat-value risk-high" id="highRisk">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Medium Risk</div>
                <div class="stat-value risk-medium" id="mediumRisk">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Low Risk</div>
                <div class="stat-value risk-low" id="lowRisk">0</div>
            </div>
        </div>
        
        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Scan History</h2>
                <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-state">No scans yet. Waiting for data from CyberLens Android app...</div>
            </div>
        </div>
    </div>
    
    <script>
        function getRatingClass(rating) {
            if (rating >= 7) return 'high';
            if (rating >= 4) return 'medium';
            return 'low';
        }
        
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString();
        }
        
        async function loadData() {
            try {
                // Load statistics
                const statsResponse = await fetch('/api/stats');
                const stats = await statsResponse.json();
                
                document.getElementById('totalScans').textContent = stats.total_scans;
                document.getElementById('highRisk').textContent = stats.risk_breakdown.high_risk;
                document.getElementById('mediumRisk').textContent = stats.risk_breakdown.medium_risk;
                document.getElementById('lowRisk').textContent = stats.risk_breakdown.low_risk;
                
                // Load history
                const historyResponse = await fetch('/api/history?limit=50');
                const history = await historyResponse.json();
                
                const historyList = document.getElementById('historyList');
                
                if (history.results.length === 0) {
                    historyList.innerHTML = '<div class="empty-state">No scans yet. Waiting for data from CyberLens Android app...</div>';
                } else {
                    historyList.innerHTML = history.results.map(item => {
                        const ratingClass = getRatingClass(item.rating);
                        return `
                            <div class="history-item">
                                <div class="host-name">
                                    ${item.target}
                                    <span class="rating-badge badge-${ratingClass}">
                                        Risk: ${item.rating}/10
                                    </span>
                                </div>
                                <div class="timestamp">${formatTimestamp(item.timestamp)}</div>
                                <ul class="issues">
                                    ${item.issues.map(issue => `<li>${issue}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 10 seconds
        setInterval(loadData, 10000);
    </script>
</body>
</html>
